name: Release

# Push a tag like v2.13.0 to build and publish a release. The tag must match `const version` in
# swirl/cardmanager/main.go, and its major.minor must match ui/swirl/sw_version.h.
#
# windows: builds the SWIRL menu from source, tests Card Manager, builds SWIRL-Card-Manager.exe
# macos:   builds the patched Flycast for Mac (cached), then SWIRL Card Manager.app (.zip and .dmg)
# publish: checksums, release notes from CHANGELOG.md, and the GitHub release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, for example v2.13.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check the version numbers
        id: ver
        run: |
          V="${TAG#v}"
          APP=$(sed -n 's/^const version = "\(.*\)"/\1/p' swirl/cardmanager/main.go)
          MENU=$(sed -n 's/^#define SWIRL_VERSION "\(.*\)"/\1/p' ui/swirl/sw_version.h)
          echo "tag $V, Card Manager $APP, menu $MENU"
          [ "$V" = "$APP" ] || { echo "::error::Tag $TAG does not match const version \"$APP\" in main.go"; exit 1; }
          case "$V" in "$MENU"|"$MENU".*) ;; *) echo "::error::Menu version $MENU does not match $V"; exit 1;; esac
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache the Dreamcast toolchain
        uses: actions/cache@v6
        with:
          path: ~/dreamcast
          key: dc-toolchain-gcc15.1.0-kos2.2.1

      - name: Build the SWIRL menu
        run: |
          if [ ! -f ~/dreamcast/kos/environ.sh ]; then swirl/setup_toolchain.sh ~/dreamcast; fi
          swirl/build.sh
          cp swirl/build/gdemu/1ST_READ.BIN swirl/cardmanager/assets/1ST_READ.BIN

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Test Card Manager
        working-directory: swirl/cardmanager
        run: go test ./... && GOOS=darwin go vet ./...

      - name: Build Card Manager for Windows
        working-directory: swirl/cardmanager
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64
          sh winres/make.sh "$VERSION"
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.updateRepo=${{ github.repository }}" \
            -o ../../dist/SWIRL-Card-Manager.exe .
          cp ../build/gdemu/1ST_READ.BIN ../../dist/1ST_READ.BIN

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/

  macos:
    needs: windows
    runs-on: macos-14
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: dist-windows
          path: dist-windows

      - name: Use the menu built from source
        run: cp dist-windows/1ST_READ.BIN swirl/cardmanager/assets/1ST_READ.BIN

      # the key comes from the files that decide the build, worked out before building
      - name: Flycast cache key
        id: fckey
        run: echo "key=flycast-macos-$(cat swirl/vmucap/build_macos.sh swirl/vmucap/vmucap_flycast.patch swirl/vmucap/vmucap.cpp | shasum -a 256 | cut -c1-20)" >> "$GITHUB_OUTPUT"

      - name: Cache the Mac build of Flycast
        id: flycast
        uses: actions/cache/restore@v6
        with:
          path: swirl/cardmanager/assets/swirl-vmucap-macos.zip
          key: ${{ steps.fckey.outputs.key }}

      - name: Build Flycast for Mac
        if: steps.flycast.outputs.cache-hit != 'true'
        run: WORK="$RUNNER_TEMP/flycast-build" swirl/vmucap/build_macos.sh

      # saved straight away, so a later failing step does not throw the 10 minute build away
      - name: Save the Mac build of Flycast
        if: steps.flycast.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: swirl/cardmanager/assets/swirl-vmucap-macos.zip
          key: ${{ steps.fckey.outputs.key }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Test the Mac parts of Card Manager
        working-directory: swirl/cardmanager
        run: |
          go vet ./...
          # failures are also posted as annotations, which anyone can read on the run's page
          go test -v -run 'MacDisk|ZipTree|Update|HeaderLogo|Backup|Titles' ./... 2>&1 | tee test.log || true
          if ! grep -q '^ok' test.log || grep -qE '^(--- )?FAIL' test.log; then
            grep -E -- '--- FAIL|_test.go:[0-9]+|panic|^FAIL|cannot|undefined' test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Build SWIRL Card Manager.app
        working-directory: swirl/cardmanager
        run: macos/make_app.sh "$VERSION" "${{ github.repository }}" ../../dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: |
            dist/SWIRL-Card-Manager-macOS.zip
            dist/SWIRL-Card-Manager-macOS.dmg

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum SWIRL-Card-Manager.exe SWIRL-Card-Manager-macOS.dmg SWIRL-Card-Manager-macOS.zip 1ST_READ.BIN > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          # the section for this version in CHANGELOG.md, if there is one
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?v?"v"[] ]" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "SWIRL $VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Install or update**
          - **Windows:** download `SWIRL-Card-Manager.exe` and run it.
          - **Mac:** download `SWIRL-Card-Manager-macOS.dmg`, open it and drag the app to Applications. The first time, macOS asks you to allow it: see [Getting started](https://github.com/${{ github.repository }}/blob/master/docs/GETTING_STARTED.md#on-a-mac).
          - Already installed? Click **Update now** in Card Manager. Then click **Update SWIRL** to put the new menu on your card.
          NOTES
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="dist/SWIRL-Card-Manager.exe dist/SWIRL-Card-Manager-macOS.dmg dist/SWIRL-Card-Manager-macOS.zip dist/1ST_READ.BIN dist/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a release made on github.com first: add the files and the notes from CHANGELOG.md
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --title "SWIRL $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" $FILES --title "SWIRL $VERSION" --notes-file notes.md
          fi
