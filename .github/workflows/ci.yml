name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu:
    name: SWIRL menu (Dreamcast)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache the Dreamcast toolchain
        uses: actions/cache@v6
        with:
          path: ~/dreamcast
          key: dc-toolchain-gcc15.1.0-kos2.2.1

      - name: Install the toolchain
        run: |
          if [ ! -f ~/dreamcast/kos/environ.sh ]; then swirl/setup_toolchain.sh ~/dreamcast; fi

      - name: Build
        run: swirl/build.sh

      - name: Compare with the menu embedded in Card Manager
        run: |
          if cmp -s swirl/build/gdemu/1ST_READ.BIN swirl/cardmanager/assets/1ST_READ.BIN; then
            echo "The embedded menu matches this build."
          else
            echo "::warning::swirl/cardmanager/assets/1ST_READ.BIN differs from a fresh build. Copy swirl/build/gdemu/1ST_READ.BIN over it if the menu sources changed."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: swirl-menu
          path: swirl/build/gdemu/1ST_READ.BIN

  # the parsers the console runs (OPENMENU.INI, the DAT reader) under the sanitizers, and the SWIRL.DAT reader
  # against a file written by every released layout (tests/host/savefiles)
  menu-host-checks:
    name: SWIRL menu (host checks)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Test library
        run: pip3 install -q pillow && python3 swirl/tools/make_test_library.py
      - name: Host checks
        run: tests/host/run.sh

  cardmanager:
    name: SWIRL Card Manager
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: swirl/cardmanager
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Vet
        run: go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./... && GOOS=linux go vet ./...

      - name: Test
        run: go test ./...

      - name: Build the Windows exe
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui -s -w -X main.updateRepo=${{ github.repository }}" -o SWIRL-Card-Manager.exe .

      - name: Build the Linux binary
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.updateRepo=${{ github.repository }}" -o SWIRL-Card-Manager .

      - uses: actions/upload-artifact@v7
        with:
          name: SWIRL-Card-Manager-exe
          path: |
            swirl/cardmanager/SWIRL-Card-Manager.exe
            swirl/cardmanager/SWIRL-Card-Manager

  cardmanager-windows:
    name: SWIRL Card Manager (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: swirl/cardmanager
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Test on Windows (the rename and lock behaviour the card writes depend on)
        run: go test ./...
